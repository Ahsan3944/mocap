name: Build Motion Capture Mod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Fabric and NeoForge (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both loader variants
        run: ./gradlew --no-daemon --stacktrace :fabric:build :neoforge:build
      - name: Validate JAR archives
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -size +10k -print -quit)"
          test -n "$(find neoforge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -size +10k -print -quit)"
          find fabric/build/libs neoforge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -size +10k -print0 | while IFS= read -r -d '' jar; do unzip -t "$jar" >/dev/null; done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mocap-26.1-build-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-sources.jar
