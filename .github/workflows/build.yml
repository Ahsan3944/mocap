name: Build Motion Capture Mod 26.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Publish source, build loaders, and publish JARs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout staging commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Assemble, verify, and publish complete source tree
        shell: bash
        run: |
          set -euo pipefail

          source_dir="$RUNNER_TEMP/mocap-source"
          patch_b64="$RUNNER_TEMP/mocap-upgrade.patch.b64"
          patch_gz="$RUNNER_TEMP/mocap-upgrade.patch.gz"
          patch_file="$RUNNER_TEMP/mocap-upgrade.patch"

          git clone --depth 1 --branch 26.1 https://github.com/mt1006/mc-mocap-mod.git "$source_dir"
          test "$(git -C "$source_dir" rev-parse HEAD)" = "450000b21a22042776c4b2b511cb5c725bf57183"

          : > "$patch_b64"
          for n in $(seq 1 26); do
            printf -v part '%03d' "$n"
            cat "$GITHUB_WORKSPACE/.upgrade-patch-v4/part-${part}.b64" >> "$patch_b64"
          done

          base64 --decode "$patch_b64" > "$patch_gz"
          printf '%s  %s\n' 'a33bc9cc6baa947a45e61aea03d0e86a76a85253feedf7d4b34967a4000b052a' "$patch_gz" | sha256sum --check
          gzip --decompress --stdout "$patch_gz" > "$patch_file"
          printf '%s  %s\n' '864d24ecaa9974b0f291dc4fef1436e3e5f5f8f5a1e262c3b703eef7dfbebb01' "$patch_file" | sha256sum --check

          git -C "$source_dir" apply --check "$patch_file"
          git -C "$source_dir" apply "$patch_file"

          mkdir -p "$source_dir/.github/workflows"
          cp "$GITHUB_WORKSPACE/.github/workflows/build.yml" "$source_dir/.github/workflows/build.yml"

          # Replace the staging placeholders and transfer the complete source tree into the repository.
          rm -rf "$GITHUB_WORKSPACE/.upgrade-patch-v4"
          rsync -a --delete --exclude='.git/' "$source_dir/" "$GITHUB_WORKSPACE/"

          git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
          git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$GITHUB_WORKSPACE" add -A
          git -C "$GITHUB_WORKSPACE" commit -m "Publish complete upgraded Motion Capture Mod 26.1 source"
          published_sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          echo "PUBLISHED_SOURCE_SHA=$published_sha" >> "$GITHUB_ENV"
          git -C "$GITHUB_WORKSPACE" push origin HEAD:main

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric and NeoForge variants
        run: ./gradlew --no-daemon --stacktrace :fabric:build :neoforge:build

      - name: Validate built JAR archives
        shell: bash
        run: |
          set -euo pipefail
          fabric_jar="$(find fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-plain.jar' -size +10k -print -quit)"
          neoforge_jar="$(find neoforge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-plain.jar' -size +10k -print -quit)"
          test -n "$fabric_jar"
          test -n "$neoforge_jar"
          while IFS= read -r -d '' jar; do
            echo "Checking $jar"
            unzip -t "$jar" >/dev/null
          done < <(find fabric/build/libs neoforge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -size +10k -print0)

      - name: Upload JAR build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mocap-26.1-upgrade-jars
          if-no-files-found: error
          retention-days: 90
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev.jar
            !**/*-plain.jar

      - name: Publish JARs as a GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          fabric_jar="$(find fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-plain.jar' -size +10k -print -quit)"
          neoforge_jar="$(find neoforge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-plain.jar' -size +10k -print -quit)"
          test -n "$fabric_jar"
          test -n "$neoforge_jar"
          jars=("$fabric_jar" "$neoforge_jar")
          tag="mocap-26.1-upgrade-${PUBLISHED_SOURCE_SHA:0:7}"
          gh release create "$tag" --target "$PUBLISHED_SOURCE_SHA" --title "Motion Capture Mod 26.1 upgrade build" --notes "Built by GitHub Actions from the published upgraded source. JAR archive integrity was checked. In-game regression and performance testing are not automated by this workflow." --prerelease "${jars[@]}"
