name: Build Motion Capture Mod 26.1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Fabric and NeoForge JARs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Fix and persist Gradle wrapper executable bit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git update-index --chmod=+x gradlew
          git add gradlew
          if ! git diff --cached --quiet; then
            git commit -m "Mark Gradle wrapper executable"
            git push origin HEAD:main
          fi
          echo "BUILD_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric and NeoForge variants
        run: ./gradlew --no-daemon --stacktrace :fabric:build :neoforge:build

      - name: Validate built JAR archives
        shell: bash
        run: |
          set -euo pipefail
          fabric_jar="$(find fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-plain.jar' -size +10k -print -quit)"
          neoforge_jar="$(find neoforge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-plain.jar' -size +10k -print -quit)"
          test -n "$fabric_jar"
          test -n "$neoforge_jar"
          unzip -t "$fabric_jar" >/dev/null
          unzip -t "$neoforge_jar" >/dev/null
          printf 'Validated: %s\nValidated: %s\n' "$fabric_jar" "$neoforge_jar"

      - name: Upload verified JAR build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mocap-26.1-upgrade-jars
          if-no-files-found: error
          retention-days: 90
          path: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*-sources.jar
            !**/*-dev.jar
            !**/*-plain.jar

      - name: Publish JARs as a GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          fabric_jar="$(find fabric/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-plain.jar' -size +10k -print -quit)"
          neoforge_jar="$(find neoforge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-plain.jar' -size +10k -print -quit)"
          test -n "$fabric_jar"
          test -n "$neoforge_jar"
          tag="mocap-26.1-upgrade-${BUILD_SOURCE_SHA:0:7}"
          gh release create "$tag" --target "$BUILD_SOURCE_SHA" --title "Motion Capture Mod 26.1 upgrade build" --notes "Built by GitHub Actions from the published upgraded source. JAR archive integrity was checked. In-game regression and performance testing are not automated by this workflow." --prerelease "$fabric_jar" "$neoforge_jar"
