name: Build Mocap Paper 1.21.11

on:
  push:
    branches: [paper-1.21.11]
    paths:
      - "paper-plugin-1.21.11/**"
      - ".github/workflows/build-paper-1.21.11.yml"
      - "VERSION_BRANCHES.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, build, validate, and publish Paper plugin
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out all version branches for source packaging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run parser tests and build Paper plugin
        run: ./gradlew -p paper-plugin-1.21.11 --no-daemon --stacktrace clean test build
      - name: Validate installable Paper plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find paper-plugin-1.21.11/build/libs -maxdepth 1 -type f -name 'Mocap-PAPER-1.21.11-*.jar' ! -name '*-sources.jar' -size +10k -print -quit)"
          test -n "$jar_file"
          unzip -t "$jar_file" >/dev/null
          unzip -l "$jar_file" | grep -q 'plugin.yml'
          unzip -l "$jar_file" | grep -q 'net/mt1006/mocap/paper/MocapPaperPlugin.class'
          unzip -l "$jar_file" | grep -q 'net/mt1006/mocap/paper/playback/MocapRecordingParser.class'
          python3 - "$jar_file" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              plugin = archive.read("plugin.yml").decode("utf-8")
          assert "main: net.mt1006.mocap.paper.MocapPaperPlugin" in plugin
          assert "api-version: '1.21.9'" in plugin
          assert "MocapPaper" in plugin
          print("Validated Paper plugin descriptor and entrypoints:", sys.argv[1])
          PY
      - name: Prepare complete source ZIP, verification report, and portable checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main +refs/heads/fabric-1.21.11:refs/remotes/origin/fabric-1.21.11 +refs/heads/paper-1.21.11:refs/remotes/origin/paper-1.21.11
          bundle_dir="$RUNNER_TEMP/mocap-complete-source"
          mkdir -p "$bundle_dir/minecraft-26.1" "$bundle_dir/minecraft-1.21.11-fabric" "$bundle_dir/minecraft-1.21.11-paper"
          git archive origin/main | tar -x -C "$bundle_dir/minecraft-26.1"
          git archive origin/fabric-1.21.11 | tar -x -C "$bundle_dir/minecraft-1.21.11-fabric"
          git archive HEAD | tar -x -C "$bundle_dir/minecraft-1.21.11-paper"
          main_sha="$(git rev-parse origin/main)"
          fabric_sha="$(git rev-parse origin/fabric-1.21.11)"
          paper_sha="$(git rev-parse HEAD)"
          main_tag="mocap-26.1-upgrade-${main_sha:0:7}"
          fabric_tag="mocap-fabric-1.21.11-uop1-${fabric_sha:0:7}"
          main_status="NOT VERIFIED: matching release tag not found"
          fabric_status="NOT VERIFIED: matching release tag not found"
          if main_target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$main_tag" --jq '.target_commitish' 2>/dev/null)"; then
            if [ "$main_target" = "$main_sha" ]; then main_status="PASS: release target matches source commit"; else main_status="FAIL: release target mismatch ($main_target)"; fi
          fi
          if fabric_target="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$fabric_tag" --jq '.target_commitish' 2>/dev/null)"; then
            if [ "$fabric_target" = "$fabric_sha" ]; then fabric_status="PASS: release target matches source commit"; else fabric_status="FAIL: release target mismatch ($fabric_target)"; fi
          fi
          jar_file="$(find paper-plugin-1.21.11/build/libs -maxdepth 1 -type f -name 'Mocap-PAPER-1.21.11-*.jar' ! -name '*-sources.jar' -size +10k -print -quit)"
          test -n "$jar_file"
          paper_jar_sha="$(sha256sum "$jar_file" | awk '{print $1}')"
          cat > "$bundle_dir/SOURCE_BUNDLE_MANIFEST.md" <<EOF
          # Mocap Complete Source Bundle

          This ZIP keeps incompatible Minecraft targets as separate, independently buildable source snapshots.

          - Minecraft 26.1 Fabric and NeoForge: minecraft-26.1/ (branch main, commit $main_sha)
          - Minecraft 1.21.11 Fabric: minecraft-1.21.11-fabric/ (branch fabric-1.21.11, commit $fabric_sha)
          - Paper 1.21.11 plugin: minecraft-1.21.11-paper/paper-plugin-1.21.11/ (branch paper-1.21.11, commit $paper_sha)

          Do not combine these roots into one universal JAR. Each target has its own dependencies, Java toolchain, and build workflow. The older separate Ahsan3944/mocap-paper prototype remains preserved in its own repository and is not the selected release implementation.
          EOF
          cat > "$bundle_dir/RELEASE_VERIFICATION.md" <<EOF
          # Mocap Release Verification Report

          Generated by GitHub Actions for Paper commit $paper_sha on $(date -u +%Y-%m-%dT%H:%M:%SZ).

          ## Build and release provenance

          | Target | Source commit | Build/release status | Runtime verification |
          |---|---|---|---|
          | Minecraft 26.1 Fabric + NeoForge | $main_sha | $main_status | NOT RUN |
          | Minecraft 1.21.11 Fabric | $fabric_sha | $fabric_status | NOT RUN |
          | Paper 1.21.11 plugin | $paper_sha | PASS: Java 21 build, unit tests, JAR integrity, plugin descriptor, and entrypoint checks passed in this workflow | NOT RUN |

          Paper JAR SHA-256: $paper_jar_sha

          The Paper automated tests cover selected parser and scene-store cases. They are not a substitute for launching a Paper 1.21.11 server and testing actual playback. Runtime acceptance tests, including the 30-minute loop and multi-actor performance tests, have not been run by this workflow.

          ## Feature matrix

          | Feature | Source implemented | Build passed | Automated test passed | Runtime test passed | Target/version | Notes |
          |---|---|---|---|---|---|---|
          | Recording/playback regression | Partial | Yes | Encoder-to-parser test plus parser tests | No | Paper 1.21.11 | Paper recording captures position, rotation, and supported poses to a Mocap v3-compatible file header with recorded profile name. Block edits, chat, inventory/equipment, damage, entity add/remove/mount, and extension actions are not recorded. Live server acceptance is still required. |
          | Random actor names and persistence | Yes | Yes | No feature-specific test | No | Paper 1.21.11 | Saved to scene JSON. Random assignment can set a profile/name on a nested-scene reference as an inherited override; edit the child scene for independent per-actor values. |
          | Scene element naming | Yes | Yes | No feature-specific test | No | Paper 1.21.11 | Direct recording elements and nested-scene references can be given player_name modifiers; independently naming actors inside a nested scene requires editing that child scene. |
          | Skin assignment | Partial | Yes | No feature-specific test | No | Paper 1.21.11 | Name-based Paper ResolvableProfile; custom PNG skins and embedded signed texture injection are not fully ported. |
          | Profile caching/prefetch | Partial | Yes | No feature-specific test | No | Paper 1.21.11 | Bounded in-memory profile cache; Paper profile resolution is delegated to Paper/Mojang services, not the mod's background prefetch implementation. |
          | Formation builder | Yes | Yes | No feature-specific test | No | Paper 1.21.11 | Grid formation creation is implemented; large formations need runtime validation. |
          | Scene copying and placement | Partial | Yes | Partial | No | Paper 1.21.11 | Copy-without-overwrite is tested; mirror and custom scene-center behavior are not fully ported. |
          | Nested scene playback | Yes, with recursion guard | Yes | No dedicated nested-scene test | No | Paper 1.21.11 | Runtime timing, transform composition, and cleanup remain unverified. |
          | Equipment presets | Partial | Yes | No feature-specific test | No | Paper 1.21.11 | Presets can be saved/applied; selected overrides are reapplied after recorded equipment frames. Persistence across server restart needs runtime testing. |
          | Enchanted equipment and item components | Partial | Yes | No feature-specific test | No | Paper 1.21.11 | Bukkit ItemStack presets may retain supported metadata; recorded item playback currently reduces items to basic material IDs and does not fully preserve arbitrary components/NBT. |
          | Bulk name-tag visibility | Yes | Yes | No feature-specific test | No | Paper 1.21.11 | Uses mannequin custom-name visibility; client/runtime behavior needs testing. |
          | Freeze/unfreeze | Yes | Yes | No feature-specific test | No | Paper 1.21.11 | Source command and playback state exist; runtime pause/resume has not been tested. |
          | End Freeze | Yes | Yes | No feature-specific test | No | Paper 1.21.11 | Final-pose hold is implemented; actors must be manually stopped. Runtime cleanup remains unverified. |
          | Long-running loop | Yes | Yes | No 30-minute regression test | No | Paper 1.21.11 | 10/30/60-second recordings must still be tested for at least 30 minutes. |
          | Low-lag/static actor mode | Partial | Yes | No benchmark test | No | Paper 1.21.11 | Uses the Mannequin immovability toggle; no performance guarantee or benchmark is claimed. |
          | Malformed-file handling | Yes | Yes | Partial | No | Paper 1.21.11 | Parser tests cover empty/truncated input, invalid versions, and unknown actions; scene tests cover version rejection and path traversal. |
          | Recursive-scene protection | Yes | Yes | No dedicated recursion test | No | Paper 1.21.11 | Recursion/depth guards are present; nested failure cleanup still needs runtime validation. |
          | Paper feature parity | Partial | Yes | Partial | No | Paper 1.21.11 | See paper-plugin-1.21.11/PORT_REPORT.md for unsupported actions and public-API limitations. |
          | Fabric 1.21.11 feature backport | Source snapshot included | See provenance status above | Selected source assertions/build checks only | No | Fabric 1.21.11 | Do not infer live gameplay correctness from compilation. |
          | Fabric/NeoForge 26.1 release | Source snapshot included | See provenance status above | Archive/metadata checks in the release workflow | No | Minecraft 26.1 | Separate loader JARs are required; no universal JAR is claimed. |

          ## Release artifacts

          - Paper JAR: Mocap-PAPER-1.21.11-1.0.0-uop1.jar
          - Complete source ZIP: contains separate 26.1, Fabric 1.21.11, and Paper 1.21.11 source snapshots.
          - SHA-256 sidecar files are attached to the release and use portable file-name entries.
          EOF
          source_zip="$GITHUB_WORKSPACE/Mocap-Complete-Source-${paper_sha:0:7}.zip"
          report_path="$GITHUB_WORKSPACE/RELEASE_VERIFICATION-${paper_sha:0:7}.md"
          cp "$bundle_dir/RELEASE_VERIFICATION.md" "$report_path"
          (cd "$RUNNER_TEMP" && zip -qr "$source_zip" mocap-complete-source)
          unzip -t "$source_zip" >/dev/null
          test -s "$source_zip"
          (cd "$(dirname "$jar_file")" && sha256sum "$(basename "$jar_file")" > "$(basename "$jar_file").sha256")
          (cd "$GITHUB_WORKSPACE" && sha256sum "$(basename "$source_zip")" > "$(basename "$source_zip").sha256" && sha256sum "$(basename "$report_path")" > "$(basename "$report_path").sha256")
          (cd "$(dirname "$jar_file")" && sha256sum -c "$(basename "$jar_file").sha256")
          (cd "$GITHUB_WORKSPACE" && sha256sum -c "$(basename "$source_zip").sha256" && sha256sum -c "$(basename "$report_path").sha256")
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mocap-complete-release-1.21.11
          if-no-files-found: error
          retention-days: 90
          path: |
            paper-plugin-1.21.11/build/libs/Mocap-PAPER-1.21.11-*.jar
            paper-plugin-1.21.11/build/libs/Mocap-PAPER-1.21.11-*.jar.sha256
            Mocap-Complete-Source-*.zip
            Mocap-Complete-Source-*.zip.sha256
            RELEASE_VERIFICATION-*.md
            RELEASE_VERIFICATION-*.md.sha256
            !paper-plugin-1.21.11/build/libs/*-sources.jar
      - name: Publish Paper plugin as a GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find paper-plugin-1.21.11/build/libs -maxdepth 1 -type f -name 'Mocap-PAPER-1.21.11-*.jar' ! -name '*-sources.jar' -size +10k -print -quit)"
          test -n "$jar_file"
          source_sha="$(git rev-parse HEAD)"
          tag="mocap-paper-1.21.11-uop1-${source_sha:0:7}"
          source_zip="$GITHUB_WORKSPACE/Mocap-Complete-Source-${source_sha:0:7}.zip"
          report_path="$GITHUB_WORKSPACE/RELEASE_VERIFICATION-${source_sha:0:7}.md"
          test -s "$source_zip"
          test -s "$report_path"
          (cd "$(dirname "$jar_file")" && sha256sum -c "$(basename "$jar_file").sha256")
          (cd "$GITHUB_WORKSPACE" && sha256sum -c "$(basename "$source_zip").sha256" && sha256sum -c "$(basename "$report_path").sha256")
          gh release create "$tag" --target "$source_sha" --title "Mocap Paper 1.21.11 — UltraOP port" --notes "Built on Java 21. Parser/scene unit tests, JAR integrity, plugin descriptor, entrypoint checks, source bundle integrity, and SHA-256 manifests passed. The attached source ZIP contains separate snapshots for Minecraft 26.1, Fabric 1.21.11, and Paper 1.21.11. The verification report lists unsupported behavior and all runtime checks that remain outstanding." --prerelease "$jar_file" "$jar_file.sha256" "$source_zip" "$source_zip.sha256" "$report_path" "$report_path.sha256"
